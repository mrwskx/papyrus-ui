name: Claude

# `@claude <anything>` on an issue, a pull request, or a review thread. One
# trigger phrase, routed to a different tier by where it is used.
#
# This repository is public, so the file checks who is talking before any tier
# runs: a drive-by mention would otherwise cost a runner, a checkout and an
# install. What it then decides is *which tier* answers: real work needs a big
# turn budget and write tools, a question needs neither.
#
# Whether a comment meant "implement" is Claude's judgement, not this file's —
# the regex below is a fast path that skips straight to the skill when the
# phrasing is obvious. Everything else lands in `converse`, where Claude can
# still reach the same conclusion and escalate.
#
# What is *not* Claude's judgement is authorization, and it is enforced here
# rather than by the PreToolUse hook: `prompt: /implement N` inlines the skill
# as a slash command without ever calling the Skill tool, so the hook cannot
# see this route. It covers Claude self-invoking the skill; these two checks
# cover the workflow driving it.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # The escalation path: `converse` dispatches this when it judges that a
  # comment the regex missed wanted an implementation run.
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to implement
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  guard:
    # A bot mention is never a request. The agent's own notes comment quotes
    # `@claude`, which was enough to start a second run on the same issue.
    #
    # The author check below reads the *comment* author, which is who is
    # talking; on a review thread that is not the issue author. The issue
    # author's association is read in the route step, where it answers a
    # different question — whether the body is trusted input.
    if: >-
      github.event_name != 'workflow_dispatch' &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    outputs:
      route: ${{ steps.route.outputs.route }}
      issue: ${{ steps.route.outputs.issue }}
    steps:
      - id: route
        env:
          BODY: ${{ github.event.comment.body }}
          IS_PR: ${{ github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_CLOSED: ${{ github.event.issue.state == 'closed' }}
          HAS_LABEL: ${{ contains(github.event.issue.labels.*.name, 'ready-for-agent') }}
          TRUSTED_AUTHOR: ${{ contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
        run: |
          echo "issue=$NUMBER" >> "$GITHUB_OUTPUT"

          if [[ "$IS_PR" == "true" ]]; then
            # A PR mention is never an implement-skill run, but it still needs
            # write tools to act on review feedback.
            echo "route=pr" >> "$GITHUB_OUTPUT"
          # No \b — bash uses POSIX ERE, where it silently never matches and
          # every comment would fall through to converse.
          elif [[ ! "$BODY" =~ @claude[[:space:]]+(please[[:space:]]+)?(implement|build|fix|ship|start|do)([[:space:]]|$) ]]; then
            # Not an implement request — a question, a nudge, anything else.
            # Answered regardless of label.
            echo "route=converse" >> "$GITHUB_OUTPUT"
          elif [[ "$IS_CLOSED" == "true" ]]; then
            echo "route=refuse" >> "$GITHUB_OUTPUT"
            echo "reason=it is closed. If the work is genuinely outstanding, reopen it — a closed issue is not a request." >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_LABEL" == "true" && "$TRUSTED_AUTHOR" == "true" ]]; then
            echo "route=implement" >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_LABEL" != "true" ]]; then
            echo "route=refuse" >> "$GITHUB_OUTPUT"
            echo "reason=it is not labelled \`ready-for-agent\`. Run \`/triage\`, or apply the label if it is already specified." >> "$GITHUB_OUTPUT"
          else
            echo "route=refuse" >> "$GITHUB_OUTPUT"
            echo "reason=it was opened by an outside author, so its body is untrusted input to an agent with write access. Rewrite it as a maintainer-authored spec with \`/to-spec\` first." >> "$GITHUB_OUTPUT"
          fi

      # Refuse here rather than in an agent job. Routing an unauthorized
      # implement request to `converse` was tried and is worse than useless:
      # the tier has no write tools, so Claude attempted the work anyway, hit
      # three permission denials, burned all 15 turns and failed the run — 49
      # seconds and a red X to say something this step says in two.
      - name: Refuse an unauthorized implement request
        if: steps.route.outputs.route == 'refuse'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.route.outputs.issue }}
          REASON: ${{ steps.route.outputs.reason }}
        run: |
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" \
            --body "Not starting an implementation run: $REASON"

  implement:
    needs: guard
    # always(): guard is skipped on workflow_dispatch, which would otherwise
    # skip every job that needs it.
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.guard.outputs.route == 'implement')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-implement-${{ github.event.inputs.issue || github.event.issue.number }}
      cancel-in-progress: false
    env:
      ISSUE: ${{ github.event.inputs.issue || github.event.issue.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          # /open-pr needs history for `git rev-list origin/main..HEAD`.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The enforcement point. `guard` already routed an unauthorized comment to
      # `converse`, but workflow_dispatch skips `guard` entirely, and the hook
      # cannot see the slash-command route at all. Same logic, same tests.
      - name: Verify authorization
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_ISSUE: ${{ env.ISSUE }}
          GATE_JOB: implement
        run: pnpm tsx scripts/gate-implement/index.ts

      # track_progress only posts a tracking comment on issue/PR events, so a
      # dispatched run leaves its own trail instead.
      - name: Announce a dispatched run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" \
            --body "Starting an implementation run: $RUN_URL"

      - name: Configure git identity
        run: |
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"

      - name: Implement the issue
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GATE_ISSUE: ${{ env.ISSUE }}
          GATE_JOB: implement
        with:
          # Do NOT pass github_token: with the default GITHUB_TOKEN, GitHub will
          # not fire workflows on the agent's commits and ci.yml never runs.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: '/implement ${{ env.ISSUE }}'
          track_progress: true
          # Bash is off by default, which is what made the first run of this
          # flow finish green having committed nothing.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 120
            --allowedTools Read,Write,Edit,Glob,Grep,Bash,Skill,TodoWrite

      # The action injects a system prompt telling Claude it may only commit and
      # push — which contradicted /implement telling it to open a PR, and which
      # instruction won was a coin flip. Opening it here means it never depends
      # on which prompt the model obeyed.
      # !cancelled(): a run cut short by the turn cap still pushed per-slice
      # commits, and a PR is a better artifact than an orphan branch.
      # Our own App token, not the action's: claude-code-action revokes the
      # installation token it minted in its own last step, so
      # `steps.claude.outputs.github_token` is already dead by the time the next
      # step runs. Not GITHUB_TOKEN either — the agent branch only gets CI via
      # the pull_request event, which a PR opened by GITHUB_TOKEN never fires.
      - name: Mint an app token
        id: app-token
        if: ${{ !cancelled() }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      - name: Open a pull request
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -n "$BRANCH" ] || exit 0
          # `branch_name` is a name, not evidence: the action sets it for a
          # branch it never pushed, and `git fetch` then dies with exit 128
          # before the three no-op guards below can speak. Checked with
          # ls-remote rather than `fetch || exit 0`, which would also swallow a
          # transient fetch failure and skip a PR that should have been opened.
          git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1 || exit 0
          git fetch origin "$BRANCH" main
          [ "$(git rev-list --count "origin/main..origin/$BRANCH")" -gt 0 ] || exit 0
          # Its own line, not inside the `||` list: there, `set -e` is off, so a
          # failed API call reads as "no PR yet" and the step skips silently.
          open=$(gh pr list --head "$BRANCH" --json number --jq 'length')
          [ "$open" -eq 0 ] || exit 0

          # Read up front: the App installation needs Issues: Read, and
          # without it this fails with "Could not resolve to an issue or pull
          # request with the number of N" — not a permission error. Inlined
          # into `gh pr create` it would expand to an empty title there.
          title=$(gh issue view "$ISSUE" --json title --jq .title)

          # Temp file, not awk -v: an assignment cannot carry newlines.
          overview=$(mktemp)
          trap 'rm -f "$overview"' EXIT
          pnpm tsx scripts/generate-pr-description/index.ts \
            "$(git rev-parse origin/main)" "$(git rev-parse "origin/$BRANCH")" \
            "$GITHUB_REPOSITORY" > "$overview"

          # Same body shape as /open-pr: the template with ## Overview filled in,
          # so pr-description.yml finds it populated and exits immediately.
          body=$(awk -v ovfile="$overview" \
            '/^<!-- Auto-populated/ { while ((getline l < ovfile) > 0) print l; next } { print }' \
            .github/PULL_REQUEST_TEMPLATE.md)

          if [ "$CONCLUSION" != "success" ]; then
            body="$body

          ## Note

          This run ended with conclusion \`$CONCLUSION\`. The branch carries the
          commits it managed before stopping and may be incomplete — $RUN_URL"
          fi

          gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"

      # Last, and `always()`: the endings worth reporting are the ones no other
      # step survives to describe — a cancelled job, a gate that refused before
      # the agent, an action that skipped itself. A step rather than a
      # downstream job because `execution_file` is a runner-local path that dies
      # with this one, and without it a report can only repeat the red X GitHub
      # already shows. See scripts/report-run.
      - name: Report how the run ended
        if: ${{ always() }}
        env:
          # github.token, not the action's App token: that output is empty on
          # exactly the endings this reports, and no commit is involved here.
          GH_TOKEN: ${{ github.token }}
          TIER: implement
          ISSUE: ${{ env.ISSUE }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          AGENT_OUTCOME: ${{ steps.claude.outcome }}
          JOB_STATUS: ${{ job.status }}
          MAX_TURNS: 120
          TIMEOUT_MINUTES: 30
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm tsx scripts/report-run/index.ts

  pr:
    needs: guard
    if: needs.guard.outputs.route == 'pr'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-pr-${{ needs.guard.outputs.issue }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"

      - name: Respond to the mention
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GATE_ISSUE: ${{ needs.guard.outputs.issue }}
          GATE_JOB: pr
        with:
          # No prompt input: interactive mode, so Claude responds to the
          # @claude trigger phrase and posts progress on the thread.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 120
            --allowedTools Read,Write,Edit,Glob,Grep,Bash,Skill,TodoWrite

      # Last, and `always()`: the endings worth reporting are the ones no other
      # step survives to describe — a cancelled job, a gate that refused before
      # the agent, an action that skipped itself. A step rather than a
      # downstream job because `execution_file` is a runner-local path that dies
      # with this one, and without it a report can only repeat the red X GitHub
      # already shows. See scripts/report-run.
      - name: Report how the run ended
        if: ${{ always() }}
        env:
          # github.token, not the action's App token: that output is empty on
          # exactly the endings this reports, and no commit is involved here.
          GH_TOKEN: ${{ github.token }}
          TIER: pr
          ISSUE: ${{ needs.guard.outputs.issue }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          AGENT_OUTCOME: ${{ steps.claude.outcome }}
          JOB_STATUS: ${{ job.status }}
          MAX_TURNS: 120
          TIMEOUT_MINUTES: 30
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm tsx scripts/report-run/index.ts

  converse:
    needs: guard
    if: needs.guard.outputs.route == 'converse'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: write is what the escalation dispatch needs, and this is the one
    # job that needs it.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
      id-token: write
    concurrency:
      group: claude-converse-${{ needs.guard.outputs.issue }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Answer the mention
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GATE_ISSUE: ${{ needs.guard.outputs.issue }}
          GATE_JOB: converse
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Unlike the other two jobs, this one *does* pass github_token. The
          # rule against it exists because commits made with GITHUB_TOKEN do not
          # fire ci.yml — and this tier never commits. What it needs instead is
          # `actions: write` to dispatch an escalation, which the App's
          # installation token does not carry: the dispatch came back
          # "Resource not accessible by integration". workflow_dispatch is one
          # of the two events GITHUB_TOKEN can still trigger, so the escalated
          # run does start.
          github_token: ${{ github.token }}
          # `gh` is enumerated rather than `gh:*` because this job holds issues
          # and pull-requests write, which a blanket grant would expose.
          # `gh workflow run` is the one write it keeps.
          #
          # The system prompt is load-bearing: without it Claude treats a
          # request it cannot fulfil as a task to retry, and spends the whole
          # turn budget colliding with the missing write tools.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 15
            --allowedTools Read,Glob,Grep,Skill,TodoWrite,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh run view:*),Bash(gh workflow run:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)
            --append-system-prompt "You are the read-only tier. You have no Write, Edit or general Bash tools and cannot change, commit or push anything. If answering needs a code change, do not attempt it and do not retry after a denial. Invoke the implement skill instead: it will either authorize an escalation or tell you why the run is not permitted. Report that outcome and stop."

      # Last, and `always()`: the endings worth reporting are the ones no other
      # step survives to describe — a cancelled job, a gate that refused before
      # the agent, an action that skipped itself. A step rather than a
      # downstream job because `execution_file` is a runner-local path that dies
      # with this one, and without it a report can only repeat the red X GitHub
      # already shows. See scripts/report-run.
      - name: Report how the run ended
        if: ${{ always() }}
        env:
          # github.token, not the action's App token: that output is empty on
          # exactly the endings this reports, and no commit is involved here.
          GH_TOKEN: ${{ github.token }}
          TIER: converse
          ISSUE: ${{ needs.guard.outputs.issue }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          AGENT_OUTCOME: ${{ steps.claude.outcome }}
          JOB_STATUS: ${{ job.status }}
          MAX_TURNS: 15
          TIMEOUT_MINUTES: 10
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm tsx scripts/report-run/index.ts
