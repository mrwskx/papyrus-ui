name: Claude

# `@claude <anything>` on an issue, a pull request, or a review thread, routed
# to a tier by where it is used and how it is phrased: implement does real
# work, pr iterates on a diff, converse answers read-only.
#
# Whether a comment meant "implement" is Claude's judgement; the regex below is
# only a fast path to the skill when the phrasing is obvious. Anything else
# lands in converse, which can reach the same conclusion and escalate.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # converse dispatches this to escalate a comment the regex did not catch.
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to implement
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  guard:
    # The agent's own tracking comment quotes `@claude`, so a bot comment would
    # otherwise start a second run on the same issue.
    #
    # The author check is on `comment`, not `issue`: it asks who is talking, and
    # on a review thread that is not the issue author. The issue author's
    # association is checked in the route step, where it asks a different
    # question — whether the body is trusted input.
    if: >-
      github.event_name != 'workflow_dispatch' &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    outputs:
      route: ${{ steps.route.outputs.route }}
      issue: ${{ steps.route.outputs.issue }}
    steps:
      - name: Route the comment
        id: route
        env:
          BODY: ${{ github.event.comment.body }}
          IS_PR: ${{ github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_CLOSED: ${{ github.event.issue.state == 'closed' }}
          HAS_LABEL: ${{ contains(github.event.issue.labels.*.name, 'ready-for-agent') }}
          TRUSTED_AUTHOR: ${{ contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
        run: |
          echo "issue=$NUMBER" >> "$GITHUB_OUTPUT"

          if [[ "$IS_PR" == "true" ]]; then
            echo "route=pr" >> "$GITHUB_OUTPUT"
          # No \b — bash uses POSIX ERE, where it silently never matches and
          # every comment would fall through to converse.
          elif [[ ! "$BODY" =~ @claude[[:space:]]+(please[[:space:]]+)?(implement|build|fix|ship|start|do)([[:space:]]|$) ]]; then
            # A question is answered regardless of label.
            echo "route=converse" >> "$GITHUB_OUTPUT"
          elif [[ "$IS_CLOSED" == "true" ]]; then
            echo "route=refuse" >> "$GITHUB_OUTPUT"
            echo "reason=it is closed. If the work is genuinely outstanding, reopen it — a closed issue is not a request." >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_LABEL" == "true" && "$TRUSTED_AUTHOR" == "true" ]]; then
            echo "route=implement" >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_LABEL" != "true" ]]; then
            echo "route=refuse" >> "$GITHUB_OUTPUT"
            echo "reason=it is not labelled \`ready-for-agent\`. Run \`/triage\`, or apply the label if it is already specified." >> "$GITHUB_OUTPUT"
          else
            echo "route=refuse" >> "$GITHUB_OUTPUT"
            echo "reason=it was opened by an outside author, so its body is untrusted input to an agent with write access. Rewrite it as a maintainer-authored spec with \`/to-spec\` first." >> "$GITHUB_OUTPUT"
          fi

      # Refused here rather than in converse: that tier has no write tools, so
      # it burns its whole budget on denials before saying the same thing.
      - name: Refuse an unauthorized implement request
        if: steps.route.outputs.route == 'refuse'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.route.outputs.issue }}
          REASON: ${{ steps.route.outputs.reason }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" \
            --body "Not starting an implementation run: $REASON"

  implement:
    needs: guard
    # always(): workflow_dispatch skips guard, which would otherwise skip every
    # job that needs it.
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.guard.outputs.route == 'implement')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-implement-${{ github.event.inputs.issue || github.event.issue.number }}
      cancel-in-progress: false
    env:
      ISSUE: ${{ github.event.inputs.issue || github.event.issue.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The PR-opening step needs history for `git rev-list` and for
          # generate-pr-description.
          fetch-depth: 0

      # No `version:` input — pnpm is pinned by `packageManager` in
      # package.json, and the action fails when both are set.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `prompt: /implement N` inlines the skill as a slash command without
      # calling the Skill tool, so the PreToolUse hook never sees this route.
      # Same script, same rules, run before the agent instead.
      - name: Verify authorization
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_ISSUE: ${{ env.ISSUE }}
          GATE_JOB: implement
        run: pnpm tsx scripts/gate-implement/index.ts

      # track_progress posts a tracking comment only on issue and PR events, so
      # a dispatched run leaves its own trail.
      - name: Announce a dispatched run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" \
            --body "Starting an implementation run: $RUN_URL"

      - name: Configure git identity
        run: |
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"

      - name: Implement the issue
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GATE_ISSUE: ${{ env.ISSUE }}
          GATE_JOB: implement
        with:
          # Do NOT pass github_token: commits made with the default
          # GITHUB_TOKEN do not fire workflows, so ci.yml never runs.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: '/implement ${{ env.ISSUE }}'
          track_progress: true
          # The skills are vendored into .agents/skills, so the checkout
          # resolves them and no marketplace fetch is needed.
          # Bash is not in the default tool set; without it the agent finishes
          # green having committed nothing.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 120
            --allowedTools Read,Write,Edit,Glob,Grep,Bash,Skill,TodoWrite

      # The PR is opened here, not by the agent: the action injects a system
      # prompt telling Claude it may only commit and push, which contradicts
      # the skill and leaves the outcome to whichever instruction wins.
      #
      # An App token, not `steps.claude.outputs.github_token`, which the action
      # revokes in its own last step; and not GITHUB_TOKEN, because a PR opened
      # with it fires no pull_request event and the branch gets no CI.
      - name: Mint an app token
        id: app-token
        if: ${{ !cancelled() }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      # !cancelled(): a run stopped by the turn cap has still pushed its
      # per-slice commits, and a PR beats an orphan branch.
      - name: Open a pull request
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -n "$BRANCH" ] || exit 0
          # `branch_name` is a name, not evidence: the action sets it for a
          # branch it never pushed, and `git fetch` would then die with exit
          # 128 before the guards below can speak. ls-remote rather than
          # `fetch || exit 0`, which would also swallow a transient failure.
          git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1 || exit 0
          git fetch origin "$BRANCH" main
          [ "$(git rev-list --count "origin/main..origin/$BRANCH")" -gt 0 ] || exit 0
          # Its own line, not inside an `||` list, where `set -e` is off and a
          # failed API call would read as "no PR yet".
          open=$(gh pr list --head "$BRANCH" --json number --jq 'length')
          [ "$open" -eq 0 ] || exit 0

          # Needs Issues: Read on the App installation. Without it this fails
          # with "Could not resolve to an issue or pull request with the number
          # of N" — not a permission error. Kept off the `gh pr create` line so
          # it cannot expand to an empty title there.
          title=$(gh issue view "$ISSUE" --json title --jq .title)

          # Temp file, not awk -v: an assignment cannot carry newlines.
          overview=$(mktemp)
          trap 'rm -f "$overview"' EXIT
          pnpm tsx scripts/generate-pr-description/index.ts \
            "$(git rev-parse origin/main)" "$(git rev-parse "origin/$BRANCH")" \
            "$GITHUB_REPOSITORY" > "$overview"

          # The template with ## Overview filled in, so pr-description.yml
          # finds it populated and exits immediately.
          body=$(awk -v ovfile="$overview" \
            '/^<!-- Auto-populated/ { while ((getline l < ovfile) > 0) print l; next } { print }' \
            .github/PULL_REQUEST_TEMPLATE.md)

          if [ "$CONCLUSION" != "success" ]; then
            body="$body

          ## Note

          This run ended with conclusion \`$CONCLUSION\`. The branch carries the
          commits it managed before stopping and may be incomplete — $RUN_URL"
          fi

          gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"

      # always(), because the endings worth reporting are the ones no other
      # step survives to describe: a cancelled job, a gate refusal, an action
      # that skipped itself. A step rather than a downstream job because
      # `execution_file` is a runner-local path that dies with this one.
      - name: Report how the run ended
        if: ${{ always() }}
        env:
          # github.token, not the App token: that output is empty on exactly
          # the endings this reports, and no commit is involved.
          GH_TOKEN: ${{ github.token }}
          TIER: implement
          ISSUE: ${{ env.ISSUE }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          AGENT_OUTCOME: ${{ steps.claude.outcome }}
          JOB_STATUS: ${{ job.status }}
          MAX_TURNS: 120
          TIMEOUT_MINUTES: 30
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm tsx scripts/report-run/index.ts

  pr:
    needs: guard
    if: needs.guard.outputs.route == 'pr'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-pr-${{ needs.guard.outputs.issue }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"

      - name: Respond to the mention
        id: claude
        uses: anthropics/claude-code-action@v1
        # The gate reads these if Claude invokes the implement skill here, and
        # refuses it as issue-scoped rather than for facts it could not read.
        env:
          GATE_ISSUE: ${{ needs.guard.outputs.issue }}
          GATE_JOB: pr
        with:
          # No prompt input: interactive mode, so Claude answers the @claude
          # trigger phrase and posts progress on the thread.
          # Do NOT pass github_token — see the implement job.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 120
            --allowedTools Read,Write,Edit,Glob,Grep,Bash,Skill,TodoWrite

      # See the implement job, and scripts/report-run.
      - name: Report how the run ended
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: pr
          ISSUE: ${{ needs.guard.outputs.issue }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          AGENT_OUTCOME: ${{ steps.claude.outcome }}
          JOB_STATUS: ${{ job.status }}
          MAX_TURNS: 120
          TIMEOUT_MINUTES: 30
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm tsx scripts/report-run/index.ts

  converse:
    needs: guard
    if: needs.guard.outputs.route == 'converse'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Narrowed from the top-level grant: read-only on contents, and the only
    # job needing `actions: write`, for the escalation dispatch.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
      id-token: write
    concurrency:
      group: claude-converse-${{ needs.guard.outputs.issue }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Answer the mention
        id: claude
        uses: anthropics/claude-code-action@v1
        # The gate reads these when Claude invokes the implement skill, and
        # hands back the escalation command for this tier.
        env:
          GATE_ISSUE: ${{ needs.guard.outputs.issue }}
          GATE_JOB: converse
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # This tier alone passes github_token. The rule against it exists
          # because commits made with GITHUB_TOKEN fire no workflows, and this
          # tier never commits. What it needs is `actions: write` to dispatch
          # the escalation, which the App installation token does not carry —
          # that dispatch returns "Resource not accessible by integration".
          github_token: ${{ github.token }}
          # `gh` is enumerated rather than `gh:*` because this job holds
          # issues and pull-requests write, which a blanket grant would expose.
          # `gh workflow run` is the one write it keeps.
          #
          # The system prompt is load-bearing: without it Claude treats a
          # request it cannot fulfil as a task to retry, and spends the whole
          # budget colliding with the missing write tools.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 15
            --allowedTools Read,Glob,Grep,Skill,TodoWrite,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh run view:*),Bash(gh workflow run:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)
            --append-system-prompt "You are the read-only tier. You have no Write, Edit or general Bash tools and cannot change, commit or push anything. If answering needs a code change, do not attempt it and do not retry after a denial. Invoke the implement skill instead: it will either authorize an escalation or tell you why the run is not permitted. Report that outcome and stop."

      # See the implement job, and scripts/report-run.
      - name: Report how the run ended
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: converse
          ISSUE: ${{ needs.guard.outputs.issue }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          AGENT_OUTCOME: ${{ steps.claude.outcome }}
          JOB_STATUS: ${{ job.status }}
          MAX_TURNS: 15
          TIMEOUT_MINUTES: 10
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm tsx scripts/report-run/index.ts
